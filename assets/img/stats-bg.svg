<svg width="1200" height="500" viewBox="0 0 1200 500"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     preserveAspectRatio="xMidYMid slice">

  <title>NexaLab — réseau technologique africain</title>
  <desc>Illustration de fond : réseau de nœuds connectés sur le continent africain, style technologique sombre</desc>

  <defs>
    <!-- Glow principal centré sur l'Afrique (Est) -->
    <radialGradient id="glow-africa" cx="72%" cy="52%" r="48%">
      <stop offset="0%"   stop-color="#4f8ef7" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#4f8ef7" stop-opacity="0"/>
    </radialGradient>
    <!-- Glow secondaire (Ouest) -->
    <radialGradient id="glow-west" cx="22%" cy="62%" r="32%">
      <stop offset="0%"   stop-color="#2563c4" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#2563c4" stop-opacity="0"/>
    </radialGradient>
    <!-- Halo sur les hubs majeurs -->
    <radialGradient id="hub-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#4f8ef7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4f8ef7" stop-opacity="0"/>
    </radialGradient>
    <!-- Grille de points -->
    <pattern id="dot-grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="0.9" fill="#4f8ef7" opacity="0.18"/>
    </pattern>
    <!-- Ligne de scan horizontale -->
    <linearGradient id="scan-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#4f8ef7" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#4f8ef7" stop-opacity="0.08"/>
      <stop offset="50%"  stop-color="#4f8ef7" stop-opacity="0.15"/>
      <stop offset="80%"  stop-color="#4f8ef7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4f8ef7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ══════════════════════════════════════════
       COUCHE 1 — Fond et ambiance
  ══════════════════════════════════════════ -->
  <rect width="1200" height="500" fill="#0a0c10"/>
  <rect width="1200" height="500" fill="url(#dot-grid)"/>
  <rect width="1200" height="500" fill="url(#glow-africa)"/>
  <rect width="1200" height="500" fill="url(#glow-west)"/>

  <!-- Ligne de scan subtile (effet tech Starlink) -->
  <rect x="0" y="248" width="1200" height="1" fill="url(#scan-line)" opacity="0.6"/>

  <!-- ══════════════════════════════════════════
       COUCHE 2 — Continent africain (filigrane)
  ══════════════════════════════════════════ -->
  <path
    d="M 660,115
       C 695,80 752,68 818,68
       L 882,80 905,90
       C 935,106 950,148 965,195
       C 958,228 930,268 906,328
       L 890,370 842,442 790,458
       C 758,458 730,440 708,375
       L 690,318 680,268
       C 690,248 708,242 718,242
       C 706,232 685,226 648,218
       L 638,196 652,140 660,115 Z"
    fill="none"
    stroke="#4f8ef7"
    stroke-width="0.8"
    opacity="0.14"
  />
  <!-- Remplissage très subtil du continent -->
  <path
    d="M 660,115
       C 695,80 752,68 818,68
       L 882,80 905,90
       C 935,106 950,148 965,195
       C 958,228 930,268 906,328
       L 890,370 842,442 790,458
       C 758,458 730,440 708,375
       L 690,318 680,268
       C 690,248 708,242 718,242
       C 706,232 685,226 648,218
       L 638,196 652,140 660,115 Z"
    fill="#4f8ef7"
    opacity="0.025"
  />

  <!-- ══════════════════════════════════════════
       COUCHE 3 — Lignes de connexion
  ══════════════════════════════════════════ -->

  <!-- === Connexions HUB → HUB (lignes principales, plus visibles) === -->
  <g stroke="#4f8ef7" stroke-width="0.8" fill="none">
    <!-- Lagos → Nairobi -->
    <line x1="718" y1="248" x2="888" y2="282" opacity="0.28"/>
    <!-- Lagos → Le Caire -->
    <line x1="718" y1="248" x2="872" y2="108" opacity="0.22"/>
    <!-- Lagos → Johannesburg -->
    <line x1="718" y1="248" x2="808" y2="400" opacity="0.2"/>
    <!-- Lagos → Abidjan -->
    <line x1="718" y1="248" x2="683" y2="238" opacity="0.3"/>
    <!-- Lagos → Luanda -->
    <line x1="718" y1="248" x2="712" y2="318" opacity="0.25"/>
    <!-- Nairobi → Johannesburg -->
    <line x1="888" y1="282" x2="808" y2="400" opacity="0.22"/>
    <!-- Nairobi → Addis -->
    <line x1="888" y1="282" x2="918" y2="218" opacity="0.3"/>
    <!-- Le Caire → Addis -->
    <line x1="872" y1="108" x2="918" y2="218" opacity="0.28"/>
    <!-- Abidjan → Dakar -->
    <line x1="683" y1="238" x2="642" y2="202" opacity="0.28"/>
    <!-- Johannesburg → Luanda -->
    <line x1="808" y1="400" x2="712" y2="318" opacity="0.2"/>
  </g>

  <!-- === Connexions HUB → secondaire (moyennes) === -->
  <g stroke="#4f8ef7" stroke-width="0.5" fill="none" opacity="0.16">
    <line x1="872" y1="108" x2="678" y2="118"/>  <!-- Caire → Casablanca -->
    <line x1="872" y1="108" x2="760" y2="92"/>   <!-- Caire → Tunis -->
    <line x1="872" y1="108" x2="820" y2="90"/>   <!-- Caire → Tripoli -->
    <line x1="872" y1="108" x2="878" y2="168"/>  <!-- Caire → Khartoum -->
    <line x1="918" y1="218" x2="950" y2="248"/>  <!-- Addis → Mogadishu -->
    <line x1="918" y1="218" x2="878" y2="168"/>  <!-- Addis → Khartoum -->
    <line x1="888" y1="282" x2="892" y2="262"/>  <!-- Nairobi → Kampala -->
    <line x1="888" y1="282" x2="910" y2="312"/>  <!-- Nairobi → Mombasa -->
    <line x1="888" y1="282" x2="842" y2="352"/>  <!-- Nairobi → Harare -->
    <line x1="808" y1="400" x2="768" y2="448"/>  <!-- Joburg → Cap -->
    <line x1="808" y1="400" x2="860" y2="378"/>  <!-- Joburg → Maputo -->
    <line x1="808" y1="400" x2="842" y2="352"/>  <!-- Joburg → Harare -->
    <line x1="718" y1="248" x2="700" y2="248"/>  <!-- Lagos → Accra -->
    <line x1="718" y1="248" x2="748" y2="295"/>  <!-- Lagos → Kinshasa -->
    <line x1="712" y1="318" x2="748" y2="295"/>  <!-- Luanda → Kinshasa -->
    <line x1="642" y1="202" x2="668" y2="215"/>  <!-- Dakar → Bamako -->
    <line x1="683" y1="238" x2="700" y2="248"/>  <!-- Abidjan → Accra -->
  </g>

  <!-- === Connexions secondaire → secondaire (fines) === -->
  <g stroke="#4f8ef7" stroke-width="0.4" fill="none" opacity="0.1">
    <line x1="760" y1="92"  x2="820" y2="90"/>   <!-- Tunis → Tripoli -->
    <line x1="820" y1="90"  x2="878" y2="168"/>  <!-- Tripoli → Khartoum -->
    <line x1="878" y1="168" x2="950" y2="248"/>  <!-- Khartoum → Mogadishu -->
    <line x1="892" y1="262" x2="910" y2="312"/>  <!-- Kampala → Mombasa -->
    <line x1="910" y1="312" x2="860" y2="378"/>  <!-- Mombasa → Maputo -->
    <line x1="860" y1="378" x2="842" y2="352"/>  <!-- Maputo → Harare -->
    <line x1="842" y1="352" x2="768" y2="448"/>  <!-- Harare → Cap Town -->
    <line x1="768" y1="448" x2="738" y2="390"/>  <!-- Cap → Windhoek -->
    <line x1="738" y1="390" x2="748" y2="295"/>  <!-- Windhoek → Kinshasa -->
    <line x1="748" y1="295" x2="700" y2="248"/>  <!-- Kinshasa → Accra -->
    <line x1="668" y1="215" x2="740" y2="202"/>  <!-- Bamako → Niamey -->
    <line x1="740" y1="202" x2="878" y2="168"/>  <!-- Niamey → Khartoum -->
    <line x1="678" y1="118" x2="760" y2="92"/>   <!-- Casablanca → Tunis -->
  </g>

  <!-- === Connexions long-range vers l'extérieur (très fines, quasi-transparentes) === -->
  <g stroke="#4f8ef7" stroke-width="0.4" fill="none" opacity="0.07">
    <!-- Caire → Dubai/Moyen-Orient -->
    <line x1="872" y1="108" x2="1048" y2="145"/>
    <!-- Caire → Europe -->
    <line x1="872" y1="108" x2="498" y2="125"/>
    <!-- Dakar → Europe -->
    <line x1="642" y1="202" x2="425" y2="82"/>
    <!-- Lagos → Europe -->
    <line x1="718" y1="248" x2="555" y2="178"/>
    <!-- Nairobi → Dubai -->
    <line x1="888" y1="282" x2="1048" y2="145"/>
    <!-- Nairobi → Asie -->
    <line x1="888" y1="282" x2="1152" y2="192"/>
    <!-- Joburg → Amériques (long arc symbolique) -->
    <line x1="808" y1="400" x2="352" y2="415"/>
  </g>

  <!-- === Réseau structurel externe (bords de l'image, style constellation) === -->
  <g stroke="#4f8ef7" stroke-width="0.35" fill="none" opacity="0.06">
    <!-- Europe/Amérique top -->
    <line x1="92"  y1="112" x2="178" y2="82"/>
    <line x1="178" y1="82"  x2="252" y2="145"/>
    <line x1="252" y1="145" x2="352" y2="95"/>
    <line x1="352" y1="95"  x2="425" y2="82"/>
    <line x1="425" y1="82"  x2="498" y2="125"/>
    <line x1="498" y1="125" x2="555" y2="178"/>
    <!-- Europe/Amérique mid -->
    <line x1="148" y1="245" x2="282" y2="295"/>
    <line x1="282" y1="295" x2="382" y2="345"/>
    <line x1="382" y1="345" x2="452" y2="278"/>
    <line x1="452" y1="278" x2="555" y2="178"/>
    <line x1="580" y1="295" x2="452" y2="278"/>
    <!-- Asie/Moyen-Orient -->
    <line x1="1048" y1="145" x2="1105" y2="95"/>
    <line x1="1048" y1="145" x2="1152" y2="192"/>
    <line x1="1048" y1="145" x2="1048" y2="272"/>
    <line x1="1048" y1="272" x2="1152" y2="372"/>
    <!-- Sud -->
    <line x1="102"  y1="398" x2="202" y2="445"/>
    <line x1="202"  y1="445" x2="352" y2="415"/>
  </g>

  <!-- ══════════════════════════════════════════
       COUCHE 4 — Halos des hubs (lueur douce)
  ══════════════════════════════════════════ -->
  <!-- Halos grandes villes — cercle diffus derrière le nœud -->
  <circle cx="888" cy="282" r="22" fill="url(#hub-halo)" opacity="0.35"/>  <!-- Nairobi -->
  <circle cx="872" cy="108" r="20" fill="url(#hub-halo)" opacity="0.3"/>   <!-- Caire -->
  <circle cx="718" cy="248" r="18" fill="url(#hub-halo)" opacity="0.3"/>   <!-- Lagos -->
  <circle cx="808" cy="400" r="16" fill="url(#hub-halo)" opacity="0.25"/>  <!-- Johannesburg -->
  <circle cx="918" cy="218" r="15" fill="url(#hub-halo)" opacity="0.28"/>  <!-- Addis -->
  <circle cx="683" cy="238" r="14" fill="url(#hub-halo)" opacity="0.25"/>  <!-- Abidjan -->
  <circle cx="642" cy="202" r="14" fill="url(#hub-halo)" opacity="0.22"/>  <!-- Dakar -->

  <!-- ══════════════════════════════════════════
       COUCHE 5 — Nœuds du réseau
  ══════════════════════════════════════════ -->

  <!-- === HUBS MAJEURS (r=5, accent bleu plein) === -->
  <g fill="#4f8ef7">
    <circle cx="718" cy="248" r="5"   opacity="0.95"/>  <!-- Lagos -->
    <circle cx="888" cy="282" r="5.5" opacity="1"/>     <!-- Nairobi -->
    <circle cx="872" cy="108" r="5"   opacity="0.95"/>  <!-- Le Caire -->
    <circle cx="808" cy="400" r="4.5" opacity="0.9"/>   <!-- Johannesburg -->
    <circle cx="683" cy="238" r="4"   opacity="0.85"/>  <!-- Abidjan -->
    <circle cx="642" cy="202" r="4"   opacity="0.85"/>  <!-- Dakar -->
    <circle cx="918" cy="218" r="4.5" opacity="0.9"/>   <!-- Addis Abeba -->
    <circle cx="712" cy="318" r="3.5" opacity="0.8"/>   <!-- Luanda -->
  </g>

  <!-- Anneau extérieur des hubs (effet "ping") -->
  <g fill="none" stroke="#4f8ef7" stroke-width="0.8">
    <circle cx="888" cy="282" r="9"   opacity="0.25"/>
    <circle cx="872" cy="108" r="8"   opacity="0.2"/>
    <circle cx="718" cy="248" r="8.5" opacity="0.22"/>
    <circle cx="918" cy="218" r="7.5" opacity="0.2"/>
  </g>

  <!-- === NŒUDS SECONDAIRES (Afrique, r=2.5) === -->
  <g fill="#4f8ef7" opacity="0.65">
    <circle cx="678" cy="118" r="2.5"/>  <!-- Casablanca -->
    <circle cx="760" cy="92"  r="2.5"/>  <!-- Tunis -->
    <circle cx="820" cy="90"  r="2.5"/>  <!-- Tripoli -->
    <circle cx="878" cy="168" r="3"/>    <!-- Khartoum -->
    <circle cx="950" cy="248" r="2.5"/>  <!-- Mogadishu -->
    <circle cx="910" cy="312" r="2.5"/>  <!-- Mombasa -->
    <circle cx="860" cy="378" r="2.5"/>  <!-- Maputo -->
    <circle cx="768" cy="448" r="2.5"/>  <!-- Cape Town -->
    <circle cx="738" cy="390" r="2.5"/>  <!-- Windhoek -->
    <circle cx="842" cy="352" r="3"/>    <!-- Harare -->
    <circle cx="748" cy="295" r="2.5"/>  <!-- Kinshasa -->
    <circle cx="700" cy="248" r="2.5"/>  <!-- Accra -->
    <circle cx="668" cy="215" r="2.5"/>  <!-- Bamako -->
    <circle cx="740" cy="202" r="2.5"/>  <!-- Niamey -->
    <circle cx="892" cy="262" r="3"/>    <!-- Kampala -->
  </g>

  <!-- === NŒUDS EXTERNES (monde, r=2, très discrets) === -->
  <g fill="#4f8ef7" opacity="0.28">
    <!-- Europe / Atlantique Nord -->
    <circle cx="92"  cy="112" r="2"/>
    <circle cx="178" cy="82"  r="2"/>
    <circle cx="252" cy="145" r="2"/>
    <circle cx="352" cy="95"  r="2"/>
    <circle cx="425" cy="82"  r="1.8"/>
    <circle cx="498" cy="125" r="2"/>
    <circle cx="148" cy="245" r="1.8"/>
    <circle cx="282" cy="295" r="1.8"/>
    <circle cx="382" cy="345" r="1.8"/>
    <circle cx="452" cy="278" r="1.8"/>
    <circle cx="555" cy="178" r="2"/>
    <circle cx="580" cy="295" r="1.8"/>
    <!-- Moyen-Orient / Asie -->
    <circle cx="1048" cy="145" r="2.5"/>
    <circle cx="1105" cy="95"  r="2"/>
    <circle cx="1152" cy="192" r="2"/>
    <circle cx="1048" cy="272" r="2"/>
    <circle cx="1152" cy="372" r="1.8"/>
    <!-- Amériques / Sud -->
    <circle cx="102"  cy="398" r="1.8"/>
    <circle cx="202"  cy="445" r="1.8"/>
    <circle cx="352"  cy="415" r="1.8"/>
  </g>

  <!-- ══════════════════════════════════════════
       COUCHE 6 — Labels villes (très subtils)
  ══════════════════════════════════════════ -->
  <g font-family="'Space Grotesk', 'Inter', sans-serif"
     font-size="9" font-weight="500"
     fill="#4f8ef7" opacity="0.45"
     text-anchor="middle">
    <text x="718" y="262">Lagos</text>
    <text x="888" y="298">Nairobi</text>
    <text x="868" y="98">Le Caire</text>
    <text x="808" y="415">Johannesburg</text>
    <text x="918" y="232">Addis Abeba</text>
    <text x="632" y="218">Dakar</text>
    <text x="672" y="252">Abidjan</text>
  </g>

  <!-- ══════════════════════════════════════════
       COUCHE 7 — Overlay de vignette (bords sombres)
  ══════════════════════════════════════════ -->
  <!-- Vignette gauche -->
  <rect x="0" y="0" width="180" height="500"
        fill="url(#vignette-left)" opacity="1"/>
  <!-- Vignette droite -->
  <rect x="1020" y="0" width="180" height="500"
        fill="url(#vignette-right)" opacity="1"/>

  <!-- On définit les dégradés de vignette après usage (SVG les résout bien) -->
  <defs>
    <linearGradient id="vignette-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0a0c10" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0c10" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vignette-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0a0c10" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0c10" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

</svg>
